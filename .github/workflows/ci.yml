name: CI Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    # -------------- Job 1: Code Quality ---------------------
    lint:
        name: Lint & Syntax Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              working-directory: backend
              run: npm ci

            - name: Check syntax
              working-directory: backend
              run: node --check index.js
        # -------------- Job 2: Docker Build ---------------------
    docker-build:
        name: Docker Build Check
        runs-on: ubuntu-latest
        needs: lint
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup docker buildx
            uses: docker/setup-buildx-action@v3

          - name: build Docker image
            uses: docker/build-push-action@v5
            with:
              context: ./backend
              target: production
              push: false
              tags: voting-backend:test
              cache-from: type=gha
              cache-to: type:gha,mode=max

        # -------------- Job 3: Security Scan ---------------------
    security:
        name: Security Scan
        runs-on: ubuntu-latest
        needs: lint
        steps:
          - name: Checkout mode
            uses: actions/checkout@v4
          - name: Setup Node.js
            uses: actions/setup-node@v4
            with: 
                node-version: '20'
          - name: Install dependencies
            working-directory: backend
            run: npm ci
          - name: Run security audit
            working-directory: backend
            run: npm audit --audit-level=high



